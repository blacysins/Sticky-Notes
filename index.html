<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Notes</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=BBH+Bogle&family=DM+Serif+Display:ital@0;1&family=Playwrite+BE+VLG:wght@100..400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="sticky-main">
      <section class="sticky-section">
        <h1 class="sticky-heading dm-serif-display-regular">Sticky Notes</h1>
        <div id="sticky-notes"></div>
        <textarea
          id="note-add"
          class="note"
          placeholder="Type a new Note..."
        ></textarea>
        <button id="create-button">+</button>
      </section>
    </main>
  </body>
</html>
